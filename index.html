<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14634F">
<title>Family Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>/* Layout: one calm column. A 4-step guided setup, then a results area with four tabs.
   Type: Fredoka (rounded, friendly) for headings, Atkinson Hyperlegible (made for low-vision readers) for everything else. */
:root {
  --bg: #F4F4F8; --surface: #FFFFFF; --soft: #EBEBF2; --ink: #1A2433; --muted: #4A5568;
  --line: #DADAE4; --ctl: #5B6270; --primary: #14634F; --on-primary: #FFFFFF;
  --accent: #FFC53D; --on-accent: #1A2433; --good: #1B6E2F; --good-bg: #E3F4E6;
  --warn: #8A4300; --warn-bg: #FFEBD2; --bad: #B3261E; --bad-bg: #FDE6E4; --mine: #1D4FA3; --mine-bg: #E0ECFF;
  --m0: #DCEBFF; --m1: #FFE0DE; --m2: #DDF3E4; --m3: #FFF0C2; --m4: #EBDDFB; --m5: #D7F2F2;
  --font-display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161C; --surface: #1B222C; --soft: #2A2616; --ink: #F2F4F7; --muted: #B8C0CC;
    --line: #323B48; --ctl: #8D97A6; --primary: #5ED1AE; --on-primary: #0B2A22;
    --accent: #FFC93C; --on-accent: #1A1400; --good: #7BE08F; --good-bg: #1B3A24;
    --warn: #FFB866; --warn-bg: #3D2A10; --bad: #FF8A80; --bad-bg: #4A1F1C; --mine: #9CC2FF; --mine-bg: #1F3552;
    --m0: #1F3552; --m1: #53262A; --m2: #1F4A33; --m3: #52441B; --m4: #3F2F5C; --m5: #1B4547;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161C; --surface: #1B222C; --soft: #2A2616; --ink: #F2F4F7; --muted: #B8C0CC;
  --line: #323B48; --ctl: #8D97A6; --primary: #5ED1AE; --on-primary: #0B2A22;
  --accent: #FFC93C; --on-accent: #1A1400; --good: #7BE08F; --good-bg: #1B3A24;
  --warn: #FFB866; --warn-bg: #3D2A10; --bad: #FF8A80; --bad-bg: #4A1F1C; --mine: #9CC2FF; --mine-bg: #1F3552;
  --m0: #1F3552; --m1: #53262A; --m2: #1F4A33; --m3: #52441B; --m4: #3F2F5C; --m5: #1B4547;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 clamp(18px, 2.4vw, 21px)/1.5 var(--font-body);
  padding-block: 12px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(30px, 6vw, 44px); }
h2 { font-size: clamp(26px, 4.6vw, 34px); }
h3 { font-size: 22px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 4px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 600; font-size: 26px; }
.brand svg { width: 40px; height: 40px; }
.hint-tag { font-size: 0.8em; padding: 4px 12px; border-radius: 99px; background: var(--soft); border: 2px solid var(--accent); }

/* stepper */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; list-style: none; margin: 0; padding: 0; }
.steps button {
  width: 100%; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 16px; cursor: pointer; padding: 6px 4px; font-weight: 700; font-size: 0.82em;
}
.steps .num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); border: 2px solid var(--ctl); font-family: var(--font-display); }
.steps button[aria-current="step"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.steps button[aria-current="step"] .num { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.steps button.done .num { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.steps .lbl { display: none; }
@media (min-width: 560px) { .steps .lbl { display: inline; } .steps button { flex-direction: row; gap: 10px; font-size: 0.9em; } }

/* cards, forms */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.card.soft { background: var(--soft); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.row > * { min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 200px; }
.field > label, .lab { font-weight: 700; }
input[type=text], input[type=number], input[type=date], select {
  min-height: 54px; padding: 8px 14px; border: 2px solid var(--ctl); border-radius: 14px; background: var(--surface); width: 100%;
}
input[type=checkbox] { width: 28px; height: 28px; accent-color: var(--primary); flex: none; }
.btn {
  min-height: 54px; padding: 10px 22px; border-radius: 99px; border: 2px solid var(--primary); background: var(--primary); color: var(--on-primary);
  font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--ctl); }
.btn.big { min-height: 66px; font-size: 1.15em; padding-inline: 34px; }
.btn.small-btn { min-height: 44px; padding: 6px 16px; font-size: 0.9em; }
.btn.danger { background: var(--surface); color: var(--bad); border-color: var(--bad); }
.btn svg, .ic { width: 24px; height: 24px; flex: none; }
.actions { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper .val { min-width: 56px; text-align: center; font-weight: 700; font-size: 1.25em; font-variant-numeric: tabular-nums; }
.stepper button { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--surface); cursor: pointer; display: grid; place-items: center; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  min-height: 52px; padding: 8px 18px; border-radius: 99px; border: 2px solid var(--ctl); background: var(--surface); cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; font-weight: 600;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--ink); }
.chip[aria-pressed="true"]::before { content: "\2713"; font-weight: 800; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 2px 12px; border-radius: 99px; font-size: 0.78em; font-weight: 700; border: 2px solid var(--line); background: var(--surface); }
.tag.good { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.tag.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }

/* members */
.mtabs { display: flex; flex-wrap: wrap; gap: 10px; }
.mtab { min-height: 58px; padding: 8px 18px; border-radius: 18px; border: 2px solid var(--ctl); cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; background: var(--surface); }
.mtab[aria-selected="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent); }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; color: var(--ink); border: 2px solid var(--ctl); flex: none; }
.c0 { background: var(--m0); } .c1 { background: var(--m1); } .c2 { background: var(--m2); } .c3 { background: var(--m3); } .c4 { background: var(--m4); } .c5 { background: var(--m5); }
.member-card { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: end; padding: 14px; border: 2px solid var(--line); border-radius: 18px; }
.member-card .avatar { width: 52px; height: 52px; font-size: 1.3em; align-self: center; }
@media (max-width: 560px) { .member-card { grid-template-columns: auto 1fr; } .member-card .rm { grid-column: 1 / -1; } }
.meter { padding: 14px 18px; border-radius: 16px; background: var(--soft); border: 2px solid var(--accent); display: flex; flex-direction: column; gap: 8px; }
.meter .nums { display: flex; flex-wrap: wrap; gap: 8px 18px; font-weight: 700; }

/* lists (stock, requests) */
.list { display: flex; flex-direction: column; gap: 10px; padding: 0; margin: 0; list-style: none; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 16px; flex-wrap: wrap; }
.item .grow { flex: 1 1 160px; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.item input[type=number] { width: 110px; min-height: 46px; }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--ctl); background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; }
.empty { padding: 18px; border: 2px dashed var(--ctl); border-radius: 16px; text-align: center; color: var(--muted); }
.grid-out { display: grid; grid-template-columns: auto repeat(4, 1fr); gap: 8px; align-items: center; }
.grid-out .dl { font-weight: 700; padding-right: 6px; }
.grid-out .chip { justify-content: center; width: 100%; padding-inline: 6px; }
.notice { padding: 14px 18px; border-radius: 16px; border: 2px solid var(--warn); background: var(--warn-bg); color: var(--ink); display: flex; gap: 12px; align-items: flex-start; }
.notice svg { color: var(--warn); margin-top: 2px; }
.notice.ok { border-color: var(--good); background: var(--good-bg); }
.notice.ok svg { color: var(--good); }

/* results */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs button { min-height: 56px; padding: 8px 20px; border-radius: 99px; border: 2px solid var(--ctl); background: var(--surface); font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.tabs button[aria-selected="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.summary-line { display: flex; flex-wrap: wrap; gap: 10px; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.day { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; overflow: hidden; }
.day > header { padding: 12px 18px; background: var(--soft); border-bottom: 2px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.day > header h3 { font-size: 21px; }
.meal { border-top: 2px solid var(--line); }
.meal:first-of-type { border-top: 0; }
.meal-btn { width: 100%; text-align: left; background: none; border: 0; padding: 14px 18px; cursor: pointer; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; min-height: 76px; }
.meal-ic { font-size: 34px; line-height: 1; text-align: center; }
.meal-kind { font-size: 0.78em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.meal-name { font-weight: 700; line-height: 1.25; }
.meal-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chev { width: 24px; height: 24px; transition: transform 0.15s; }
.meal.open .chev { transform: rotate(180deg); }
.detail { padding: 4px 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.detail h4 { margin: 0 0 6px; font-family: var(--font-display); font-size: 18px; }
.detail ul, .detail ol { margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 4px; }
.nutr-row { display: flex; flex-wrap: wrap; gap: 8px; }
.nutr-row span { padding: 4px 12px; border-radius: 12px; background: var(--soft); font-weight: 700; font-variant-numeric: tabular-nums; }
.alts { display: flex; flex-direction: column; gap: 8px; }
.alt { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 8px 12px; border: 2px solid var(--line); border-radius: 14px; }
.skip-row, .none-row { padding: 18px; color: var(--muted); display: flex; gap: 12px; align-items: center; }

/* grocery */
.groc { display: flex; flex-direction: column; gap: 10px; }
.groc label { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; min-height: 60px; }
.groc label .nm { flex: 1 1 auto; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.groc label .qt { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.groc label .st { display: block; font-weight: 400; font-size: 0.8em; color: var(--muted); }
.groc input:checked ~ .nm { text-decoration: line-through; color: var(--muted); }
.groc.have label { background: var(--good-bg); border-color: var(--good); }

/* nutrition */
.mem-nutr { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.bar-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; }
@media (max-width: 480px) { .bar-row { grid-template-columns: 1fr auto; } .bar-row .track { grid-column: 1 / -1; order: 3; } }
.track { height: 18px; border-radius: 99px; background: var(--soft); border: 2px solid var(--ctl); overflow: hidden; position: relative; }
.fill { display: block; height: 100%; background: var(--primary); }
.fill.warn { background: var(--warn); }
.macro { display: flex; height: 40px; border-radius: 12px; overflow: hidden; border: 2px solid var(--ctl); font-weight: 700; }
.macro span { display: grid; place-items: center; color: var(--ink); min-width: 0; font-size: 0.85em; }
.m-p { background: var(--m1); } .m-c { background: var(--m3); } .m-f { background: var(--m0); }
.daybars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 190px; padding-top: 8px; }
.daybar { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; font-size: 0.8em; font-weight: 700; }
.daybar .col { width: 100%; max-width: 54px; background: var(--primary); border-radius: 10px 10px 4px 4px; min-height: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-weight: 700; font-size: 0.85em; }
.legend i { display: inline-block; width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--ctl); vertical-align: -2px; margin-right: 6px; }
.fine { font-size: 0.82em; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 12px 22px; border-radius: 99px; font-weight: 700; z-index: 20; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ===== dashboard ===== */
.dash-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.dash-top h1 { font-size: clamp(26px, 5vw, 36px); }
.eyebrow { font-weight: 800; letter-spacing: 0.08em; }
.strip { display: flex; align-items: center; gap: 2px; }
.pills { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; flex: 1; min-width: 0; }
.dpill { min-height: 88px; border-radius: 99px; border: 2px solid transparent; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-weight: 700; padding: 6px 0; min-width: 0; }
.dpill[aria-pressed="true"] { background: var(--soft); border-color: var(--ink); }
.dw { font-size: 0.8em; color: var(--muted); }
.dn { font-size: 1.25em; font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: transparent; }
.dot.on { background: var(--ink); }
.icon-btn.flat { border-color: transparent; background: transparent; width: 40px; }
.icon-btn:disabled { opacity: 0.3; cursor: default; }
.switch { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--ctl); border-radius: 99px; overflow: hidden; background: var(--surface); }
.switch button { min-height: 54px; border: 0; background: transparent; font-weight: 800; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.sec-head { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: 0.08em; }
.sec-ic { width: 42px; height: 42px; border-radius: 12px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; }
.btn.wide { width: 100%; text-transform: uppercase; letter-spacing: 0.06em; }
.mlist { display: flex; flex-direction: column; gap: 14px; }
.mcard { background: var(--surface); border-radius: 20px; border: 2px solid var(--line); overflow: hidden; }
.mrow { display: grid; grid-template-columns: clamp(104px, 28vw, 150px) 1fr; }
.mthumb { border: 0; border-right: 6px solid var(--primary); cursor: pointer; display: grid; place-items: center; font-size: clamp(46px, 12vw, 64px); min-height: 150px; border-radius: 0; }
div.mthumb { cursor: default; }
.mbody { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mtop { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.mname { background: none; border: 0; padding: 0; text-align: left; font: inherit; font-weight: 800; font-size: 1.1em; line-height: 1.25; cursor: pointer; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.mact { display: flex; gap: 6px; flex: none; }
.mkind { color: var(--muted); font-weight: 600; }
.mtags { display: flex; flex-wrap: wrap; gap: 6px; }
.mmeta { margin-top: auto; font-weight: 800; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.icon-btn.done[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.mcard .detail { border-top: 2px solid var(--line); padding-top: 16px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 10px 4px; text-align: center; font-weight: 800; font-size: 1.1em; font-variant-numeric: tabular-nums; }
.stat small { display: block; font-weight: 600; color: var(--muted); font-size: 0.8em; }
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 2px solid var(--line); z-index: 15; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.bottom-nav .in { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.bottom-nav button { border: 0; background: transparent; min-height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700; font-size: 0.78em; cursor: pointer; color: var(--muted); border-top: 4px solid transparent; }
.bottom-nav button[aria-current="page"] { color: var(--primary); border-top-color: var(--primary); }
.wrap.results { padding-bottom: 96px; }
.toast { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
.groc input[type=checkbox] { width: 34px; height: 34px; }
.groc label .nm { display: flex; flex-direction: column; gap: 2px; }
.groc label .st { display: block; font-weight: 500; font-size: 0.88em; color: var(--muted); }
.groc label.cov { background: var(--good-bg); border-color: var(--good); cursor: default; }

.mthumb { position: relative; overflow: hidden; }
.mthumb .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.ill { display: block; width: 100%; height: auto; }
.mthumb .ill { width: 80%; max-width: 124px; }
.meal-ic .ill { width: 52px; height: 52px; }
.ico .ill { display: inline-block; width: 34px; height: 34px; vertical-align: middle; }

/* week switcher */
.weekbar { display: flex; align-items: center; justify-content: space-between; gap: 4px; background: var(--surface); border-radius: 18px; padding: 4px; }
.wk-title { font-weight: 800; text-align: center; flex: 1; }
.wk-chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; }
.wk-chips button { flex: none; min-height: 44px; padding: 0 16px; border-radius: 99px; border: 2px solid var(--ctl); background: var(--surface); font-weight: 700; cursor: pointer; }
.wk-chips button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

/* courses and alternatives on each meal */
.cpanel { border-top: 2px solid var(--line); background: var(--soft); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.cp-n { display: flex; flex-direction: column; gap: 6px; }
.cp-course { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 12px; }
.cp-lab { font-weight: 800; letter-spacing: 0.04em; }
.cp-lab.alt { font-weight: 600; font-size: 0.9em; color: var(--muted); letter-spacing: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

// Planning engine: restrictions, scoring, plan generation, grocery list, nutrition.
// Four meal categories per day. Tea-time snacks only come from an optional breakfast leftover.
const MEALS = ['b', 'l', 's', 'd'];
const NM = MEALS.length;
const MEAL_SHORT = { b: 'Breakfast', l: 'Lunch', s: 'School', d: 'Dinner' };
const MEAL_NAME = { b: 'Breakfast Items', l: 'Lunch Items', s: 'School Lunch', d: 'Dinner' };
// Every meal is built from up to four dish slots.
const ROLES = ['main', 'meat', 'gravy', 'veg'];
const ROLE_NAME = { main: 'Main Dish', meat: 'Meat or Fish Item', gravy: 'Gravy Item', veg: 'Vegetable Item' };
// Menu emphasis: mostly South Indian, some chapati and sabji, a little Mediterranean.
const CUISINE_BONUS = { 'South Indian': 1.1, 'North Indian': 0.2 };
const MEAT = ['pork', 'beef', 'chicken', 'lamb'];
const SEAFOOD = ['fish', 'shellfish'];

const ALLERGY_OPTS = [
  ['gluten', 'Gluten / wheat'], ['dairy', 'Milk / dairy'], ['egg', 'Eggs'], ['peanut', 'Peanuts'],
  ['treenut', 'Tree nuts'], ['soy', 'Soy'], ['fish', 'Fish'], ['shellfish', 'Shellfish'], ['sesame', 'Sesame']
];
const DIET_OPTS = [
  ['vegetarian', 'Vegetarian'], ['vegan', 'Vegan'], ['halal', 'Halal'], ['kosher', 'Kosher'],
  ['nopork', 'No pork'], ['nobeef', 'No beef']
];
const HEALTH_OPTS = [
  ['lowsalt', 'Low salt'], ['lowsugar', 'Low sugar'], ['soft', 'Soft foods'], ['mild', 'No spicy food']
];

function ageInfo(age) {
  age = Number(age);
  if (age < 4) return { label: 'Toddler', factor: 0.5, kcal: 1200, protein: 20, fiber: 15, sodium: 1000 };
  if (age < 12) return { label: 'Child', factor: 0.75, kcal: 1600, protein: 30, fiber: 20, sodium: 1500 };
  if (age < 18) return { label: 'Teen', factor: 1.2, kcal: 2400, protein: 55, fiber: 28, sodium: 2300 };
  if (age < 65) return { label: 'Adult', factor: 1, kcal: 2200, protein: 55, fiber: 28, sodium: 2300 };
  return { label: 'Senior', factor: 0.85, kcal: 1800, protein: 60, fiber: 25, sodium: 1500 };
}

function norm(s) {
  return String(s).toLowerCase().trim().replace(/oes\b/g, 'o').replace(/ies\b/g, 'y').replace(/(\w{3,})s\b/g, '$1');
}
function terms(str) {
  return String(str || '').split(/[,;\n]/).map(norm).filter(Boolean);
}
const SYN = [['eggplant', 'brinjal aubergine baingan'], ['okra', 'bhindi ladies finger'], ['bottle gourd', 'lauki'], ['curd', 'yogurt yoghurt dahi'],
  ['potato', 'aloo'], ['cauliflower', 'gobi'], ['spinach', 'palak'], ['chickpea', 'chana'], ['kidney bean', 'rajma'], ['prawn', 'shrimp'],
  ['lamb', 'mutton'], ['wheat flour', 'chapati roti atta'], ['black-eyed pea', 'lobia'], ['toor dal', 'sambar'], ['dosa batter', 'dosa'], ['idli batter', 'idli'],
  ['paneer', 'cottage cheese'], ['coconut', 'chutney'], ['bell pepper', 'capsicum'], ['zucchini', 'courgette']];
function recipeText(r) {
  const base = norm([r.name, r.cuisine, r.allergens.join(' '), r.ingr.map(i => i.name).join(' ')].join(' | '));
  return base + ' | ' + SYN.filter(([k]) => base.includes(k)).map(x => x[1]).join(' ');
}
function mainProtein(r) {
  for (const a of ['chicken', 'beef', 'pork', 'lamb', 'fish', 'shellfish']) if (r.allergens.includes(a)) return a;
  const t = r.ingr.map(i => i.name.toLowerCase()).join(' ');
  if (/paneer/.test(t)) return 'paneer';
  if (/tofu/.test(t)) return 'tofu';
  if (/lentil|\bdal\b|chickpea|chana|bean|rajma|lobia|black-eyed|moong/.test(t)) return 'legumes';
  if (r.allergens.includes('egg') && r.ingr.some(i => /egg/i.test(i.name) && i.qty >= 1)) return 'egg';
  if (r.allergens.includes('dairy')) return 'dairy';
  return 'veg';
}

// Returns a list of reasons this recipe is unsuitable for one member (empty = suitable).
function conflicts(r, m) {
  const out = [];
  const A = r.allergens, ar = m.allergies || [], di = m.diets || [], he = m.health || [];
  const age = Number(m.age);
  ar.forEach(a => { if (A.includes(a)) out.push(`contains ${a === 'treenut' ? 'tree nuts' : a}`); });
  const isMeat = A.some(a => MEAT.includes(a)), isSea = A.some(a => SEAFOOD.includes(a));
  if (di.includes('vegan') && (isMeat || isSea || A.includes('dairy') || A.includes('egg') || A.includes('honey'))) out.push('not vegan');
  else if (di.includes('vegetarian') && (isMeat || isSea)) out.push('not vegetarian');
  if ((di.includes('halal') || di.includes('nopork')) && A.includes('pork')) out.push('contains pork');
  if (di.includes('kosher') && (A.includes('pork') || A.includes('shellfish') || (isMeat && A.includes('dairy')))) out.push('not kosher');
  if (di.includes('nobeef') && A.includes('beef')) out.push('contains beef');
  const brk = r.meal ? r.meal === 'b' : (r.meals || []).length > 0 && r.meals.every(x => x === 'b');
  const saltCap = brk ? 450 : 600, sugarCap = brk ? 12 : 10;
  if (he.includes('lowsalt') && r.nutr.sodium > saltCap) out.push('too salty');
  if (he.includes('lowsugar') && r.nutr.sugar > sugarCap) out.push('too sweet');
  if ((he.includes('soft') || age < 4) && r.soft === 0) out.push('not soft enough');
  if ((he.includes('mild') || age < 12) && r.spicy) out.push('too spicy');
  const rt = recipeText(r);
  terms(m.dislikes).forEach(t => { if (rt.includes(t)) out.push(`includes ${t}`); });
  return out;
}

function validFor(r, members) {
  const reasons = [];
  members.forEach(m => conflicts(r, m).forEach(c => reasons.push(`${m.name || 'Member'}: ${c}`)));
  return { ok: reasons.length === 0, reasons };
}

function likesScore(r, members) {
  const rt = recipeText(r);
  let s = 0;
  members.forEach(m => terms(m.likes).forEach(t => { if (rt.includes(t)) s += 1; }));
  return s;
}

function householdFactor(members) {
  return members.reduce((a, m) => a + ageInfo(m.age).factor, 0);
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function stockMatches(stockName, ingName) {
  const clean = x => norm(String(x).replace(/^\s*(atta|chapati flour)\s*$/i, 'wheat flour').replace(/\(.*?\)/g, ''));
  const s = clean(stockName), i = clean(ingName);
  if (!s || !i) return false;
  if (s === i) return true;
  const st = s.split(/\s+/), it = i.split(/\s+/);
  if (!st.every(w => it.includes(w))) return false;
  const head = a => a[a.length - 1];
  return head(st) === head(it) || (st.length === 1 && ['chicken', 'fish', 'lamb', 'prawn', 'egg', 'paneer', 'dal'].includes(s));
}


// ---- Units: litres are stored as millilitres inside the engine ----
const baseQty = (q, unit) => (unit === 'L' ? q * 1000 : q);
const baseUnit = unit => (unit === 'L' ? 'ml' : (['g', 'ml', 'pc', 'pkt'].includes(unit) ? unit : 'g'));
const isSchoolDay = (state, d) => {
  if (state.school === false) return false;
  const [y, m, dd] = String(state.start).split('-').map(Number);
  const wd = new Date(y, m - 1, dd + d).getDay();
  return wd >= 1 && wd <= 5;
};

// ---- Plan generation ----
// plan.slots has 28 entries, index = day*4 + meal index (b, l, s, d).
// slot kinds: recipe (items = one dish id per slot role), leftover (school lunch reused from a dinner), fridge (cooked food already at home), skip, none
function generatePlan(state, seed) {
  const rnd = mulberry32(seed || 1);
  const members = state.members;
  const f = householdFactor(members);
  const slots = Array(7 * NM).fill(null);
  const warnings = [];
  const idx = (d, m) => d * NM + MEALS.indexOf(m);

  const pool = { b: [], l: [], s: [], d: [] };
  const eliminated = { b: {}, l: {}, s: {}, d: {} };
  const IDEAS = engineRecipes();
  IDEAS.forEach(r => {
    const v = validFor(r, members);
    if (v.ok) pool[r.meal].push(r);
    else v.reasons.forEach(x => { const who = x.split(':')[0]; eliminated[r.meal][who] = (eliminated[r.meal][who] || 0) + 1; });
  });
  const poolInfo = {};
  MEALS.forEach(m => { poolInfo[m] = { valid: pool[m].length, total: IDEAS.filter(r => r.meal === m).length }; });

  const rem = (state.stock || []).map(s => ({ ...s, unit: baseUnit(s.unit), left: baseQty(Number(s.qty) || 0, s.unit) }));
  const used = new Set();
  const chosen = []; // {day, meal, r}

  function stockBonus(r) {
    const ing = r.ingr.filter(i => i.cat !== 'home');
    let sum = 0;
    ing.forEach(i => {
      const u = baseUnit(i.unit), need = baseQty(i.qty, i.unit) * f;
      rem.forEach(s => {
        if (s.unit === u && s.left > 0 && stockMatches(s.name, i.name)) sum += (Math.min(s.left, need) / need) * (s.soon ? 2 : 1);
      });
    });
    return ing.length ? (4 * sum) / ing.length : 0;
  }
  function consumeStock(r) {
    r.ingr.filter(i => i.cat !== 'home').forEach(i => {
      const u = baseUnit(i.unit); let need = baseQty(i.qty, i.unit) * f;
      rem.forEach(s => {
        if (s.unit === u && s.left > 0 && need > 0 && stockMatches(s.name, i.name)) {
          const x = Math.min(s.left, need); s.left -= x; need -= x;
        }
      });
    });
  }
  function score(r, day, meal, noise) {
    let sc = noise ? rnd() * 1.5 : 0;
    sc += likesScore(r, members) * 2 + stockBonus(r);
    const mp = mainProtein(r);
    let sameWeek = 0, sameCuisine = 0;
    chosen.forEach(c => {
      if (c.r.meal === meal) {
        if (mainProtein(c.r) === mp && mp !== 'veg') sameWeek++;
        if (c.r.cuisine === r.cuisine) sameCuisine++;
        if (Math.abs(c.day - day) === 1 && mainProtein(c.r) === mp && mp !== 'veg') sc -= 3;
        if (Math.abs(c.day - day) === 1 && c.r.cuisine === r.cuisine) sc -= 1.3;   // avoid the same cuisine on back-to-back days
      } else if (c.day === day) {
        if (mainProtein(c.r) === mp && mp !== 'veg') sc -= 2;
        if (c.r.cuisine === r.cuisine) sc -= 0.25;
        sc -= 2 * r.dishIds.filter(id => c.r.dishIds.includes(id)).length;           // the same dish twice in one day
      }

  }

    let cands = (candidatesOverride || pool[meal]).filter(r => !used.has(r.id));
    let repeated = false;
    if (!cands.length) {
      cands = candidatesOverride || pool[meal];
      repeated = cands.length > 0;
    }
    if (!cands.length) return null;
    let best = null, bs = -1e9;
    cands.forEach(r => { const s = score(r, day, meal, true); if (s > bs) { bs = s; best = r; } });
    return { r: best, repeated };
  }

    slots[idx(day, meal)] = expandSlot({ kind: 'recipe', comboId: r.id, ...extra });
    used.add(r.id); chosen.push({ day, meal, r });

  for (let d = 0; d < 7; d++) if (!isSchoolDay(state, d)) slots[idx(d, 's')] = { kind: 'skip', noschool: true };
  // 1. skipped meals (eating out)
  (state.skips || []).forEach(k => { const [d, m] = k.split('-'); if (MEALS.includes(m) && !(slots[idx(+d, m)] && slots[idx(+d, m)].noschool)) slots[idx(+d, m)] = { kind: 'skip' }; });

    if (!MEALS.includes(q.meal)) return;
    const i = idx(q.day, q.meal);
    if (!q.text || (slots[i] && slots[i].kind === 'skip')) return;
    const ts = terms(q.text);
    const match = rr => ts.some(t => recipeText(rr).includes(t));
    const okc = pool[q.meal].filter(match);
    if (okc.length) {
      const p = pick(q.day, q.meal, okc);
      assign(q.day, q.meal, p.r, { request: q.text });
    } else {
      const any = IDEAS.filter(r => r.meal === q.meal && match(r));
      if (any.length) {
        const why = [...new Set(validFor(any[0], members).reasons)].slice(0, 2).join('; ');

    if (m === 's' && slots.every((s, i) => MEALS[i % NM] !== 's' || (s && s.noschool))) return;
    if (p.valid === 0) warnings.push(`No ${MEAL_NAME[m].toLowerCase()} ideas fit everyone's restrictions together.`);
    else if (slots.some((s, i) => MEALS[i % NM] === m && s && s.repeated)) warnings.push(`Only ${p.valid} ${MEAL_NAME[m].toLowerCase()} ${p.valid === 1 ? 'idea fits' : 'ideas fit'} everyone, so some repeat this week.`);
  });
  return { slots, warnings, poolInfo, eliminated, seed, v: 3 };
}

// ---- Alternatives for one slot ----
function alternatives(plan, state, slotIndex, limit) {
  const meal = MEALS[slotIndex % NM];
  const inPlan = new Set(plan.slots.filter(s => s && s.comboId).map(s => s.comboId));
  const list = engineRecipes().filter(r => r.meal === meal && !inPlan.has(r.id) && validFor(r, state.members).ok);
  const stockScore = r => {
    let s = 0;
    r.ingr.forEach(i => (state.stock || []).forEach(st => { if (baseUnit(st.unit) === baseUnit(i.unit) && stockMatches(st.name, i.name)) s += st.soon ? 2 : 1; }));
    return s + likesScore(r, state.members) * 2;
  };
  return list.sort((a, b) => stockScore(b) - stockScore(a)).slice(0, limit || 4);
}

// Put a new slot into the plan. Any leftover link on the old slot is undone first.
function replaceSlot(plan, slotIndex, fresh) {
  const slots = plan.slots.map(s => (s ? { ...s, items: s.items ? { ...s.items } : s.items } : s));
  unlinkLeftover(slots, slotIndex);
  slots[slotIndex] = fresh;
  return { ...plan, slots };
}
// Replace the whole meal with one of the suggested meal ideas (its dishes fill the slots).
function swapMeal(plan, slotIndex, comboId) {
  return replaceSlot(plan, slotIndex, expandSlot({ kind: 'recipe', comboId, swapped: true }));
}

// ---- Summary: shopping list, stock, calories, variety, leftovers ----
function fmtQty(q, unit) {
  if (unit === 'g') return q >= 1000 ? `${+(q / 1000).toFixed(2)} kg` : `${q} g`;
  if (unit === 'ml' || unit === 'L') { const ml = baseQty(q, unit); return ml >= 1000 ? `${+(ml / 1000).toFixed(2)} L` : `${ml} ml`; }
  if (unit === 'pkt') return `${q} ${q === 1 ? 'packet' : 'packets'}`;
  return `${q} ${q === 1 ? 'pc' : 'pcs'}`;
}
function roundUp(q, unit) { return unit === 'pc' || unit === 'pkt' ? Math.ceil(q - 1e-9) : Math.ceil(q / 10 - 1e-9) * 10; }

function summarize(plan, state) {
  const members = state.members;
  const f = householdFactor(members);
  const needs = {};
  const perDay = Array.from({ length: 7 }, () => ({ kcal: 0, n: 0 }));
  const proteins = {}; const recipesUsed = new Set();
  let vegMeals = 0, fishMeals = 0, planned = 0;
  const plannedLeft = [], fridgeMeals = [];

  plan.slots.forEach((s, i) => {
    const day = Math.floor(i / NM);
    if (!s || s.kind === 'skip') return;
    let kcal = 0, any = false;
    if (s.kind === 'fridge') { kcal += 550; any = true; fridgeMeals.push({ day, name: s.name }); }
    const dishes = slotDishes(s);
    dishes.forEach(d => {
      const r = d.r;
      kcal += r.nutr.kcal; any = true;
      if (d.kind === 'leftover') return;                       // already cooked: nothing more to buy
      r.ingr.forEach(g => {
        if (g.cat === 'home') return;
        const u = baseUnit(g.unit), k = g.name + '|' + u;
        if (!needs[k]) needs[k] = { name: g.name, unit: u, group: g.cat, need: 0 };
        needs[k].need += baseQty(g.qty, g.unit) * f * (state.scale || 1);
      });
      recipesUsed.add(r.id);
      const mp = mainProtein(r);
      if (d.role === 'main' && mp === 'veg') return;           // plain rice, breads and tiffin are not the main protein
      proteins[mp] = (proteins[mp] || 0) + 1;
      if (['veg', 'legumes', 'tofu', 'dairy', 'egg'].includes(mp)) vegMeals++;
      if (r.allergens.includes('fish')) fishMeals++;
    });
    if (s.snack && s.kind === 'recipe') { dishes.forEach(d => { kcal += d.r.nutr.kcal; }); plannedLeft.push({ kind: 'snack', day, fromDay: day, dishes }); }
    if (s.toSchool != null && s.kind === 'recipe') plannedLeft.push({ kind: 'school', day: Math.floor(s.toSchool / NM), fromDay: day, dishes });
    if (!any) return;

    perDay[day].kcal += kcal; perDay[day].n++;
  });

  // shopping list = what the plan needs, minus what is already in stock
  const stockLeft = (state.stock || []).map(s => ({ name: s.name, unit: baseUnit(s.unit), left: baseQty(Number(s.qty) || 0, s.unit), used: 0, soon: !!s.soon }));
  const items = Object.values(needs).map(n => {
    let need = n.need, fromStock = 0;
    stockLeft.forEach(s => {
      if (s.unit === n.unit && s.left > 0 && need > 0 && stockMatches(s.name, n.name)) {
        const u = Math.min(s.left, need); s.left -= u; s.used += u; need -= u; fromStock += u;
      }
    });
    return { ...n, fromStock, buy: need > 0.0001 ? roundUp(need, n.unit) : 0, total: roundUp(n.need, n.unit) };
  });
  const toBuy = items.filter(i => i.buy > 0).length;
  const covered = items.filter(i => i.buy === 0).length;

  return `<div class="top"><div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="var(--accent)" stroke="var(--ink)" stroke-width="3"/><circle cx="24" cy="24" r="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/><path d="M24 15c-5 0-8 3-8 8 5 0 8-3 8-8z" fill="var(--primary)"/></svg>Family Table</div>${state.example ? '<span class="hint-tag">Example family</span>' : ''}<span id="cloudtag" class="hint-tag cloud-${cloud.status}">${cloudLabel()}</span>${ui.view === 'recipes' ? '' : `<button class="btn ghost small-btn" ${A('recipes')}>${ic('book')} Dishes</button>`}</div>`;
}
const STEP_LBL = ['Household', 'Needs', 'Kitchen', 'Plan'];
function stepper() {
  const back = ui.plan ? `<div><button class="btn ghost small-btn" ${A('goto-results')}>${ic('left')} Back to my plan</button></div>` : '';
  return back + `<ol class="steps" aria-label="Setup steps">${STEP_LBL.map((l, i) => {
    const n = i + 1, cur = ui.step === n, done = ui.step > n;
    return `<li><button ${A('goto', n)} class="${done ? 'done' : ''}" ${cur ? 'aria-current="step"' : ''}><span class="num">${done ? ic('check') : n}</span><span class="lbl">${l}</span></button></li>`;
  }).join('')}</ol>`;
}

// ---------- step 1: household ----------
function ageNote(age) {
  const a = ageInfo(age);
  const extra = age < 4 ? ' Meals are kept soft and mild.' : age < 12 ? ' Spicy food is always left out.' : '';
  return `${a.label}. Quantities are about ${Math.round(a.factor * 100)}% of an adult's.${extra}`;
}
function step1() {
  const ex = state.example ? `<div class="notice ok">${ic('info')}<div><b>This is an example family.</b> Change anything to try it out, or <button class="btn small-btn ghost" ${A('fresh')}>Start with my own household</button></div></div>` : '';
  const members = state.members.map((m, i) => `
    <li class="member-card"><span class="avatar ${lc(i)}">${initial(m, i)}</span>
      <div class="row" style="align-items:flex-end">
        <div class="field"><label for="n${i}">Name</label><input type="text" id="n${i}" data-f="name" data-i="${i}" value="${esc(m.name)}" placeholder="Person ${i + 1}" autocomplete="off"></div>
        <div class="field" style="flex:0 0 auto"><span class="lab">Age</span>
          <div class="stepper"><button ${A('age-', i)} aria-label="Younger">${ic('minus')}</button><span class="val" aria-live="polite">${m.age}</span><button ${A('age+', i)} aria-label="Older">${ic('plus')}</button></div></div>
      </div>
      ${state.members.length > 1 ? `<button class="btn ghost small-btn rm" ${A('rm-member', i)}>${ic('trash')} Remove</button>` : ''}
      <p class="fine" style="grid-column:1/-1">${esc(ageNote(m.age))}</p>
    </li>`).join('');
  return `${ex}
  <section class="card"><h2>Who is eating together?</h2>
    <div class="row">
      <div class="field"><label for="hh">Household name</label><input type="text" id="hh" data-f="hh" value="${esc(state.hhName)}"></div>
      <div class="field"><label for="st">Week starts on</label><input type="date" id="st" data-f="start" value="${esc(state.start)}"></div>
    </div>
    <ul class="list">${members}</ul>
    <div><button class="btn ghost" ${A('add-member')}>${ic('plus')} Add a person</button></div>
    <label class="item" style="cursor:pointer"><input type="checkbox" data-f="school" ${state.school !== false ? 'checked' : ''}><span class="grow">Plan a School Lunch on school days <span class="muted" style="font-weight:400">(Monday to Friday)</span></span></label>
  </section>
  <div class="actions"><span></span><button class="btn big" ${A('goto', 2)}>Next: everyone's needs ${ic('right')}</button></div>`;
}

// ---------- step 2: needs ----------
function chipGroup(opts, list, key, i) {
  return `<div class="chips">${opts.map(([v, l]) => `<button class="chip" ${A('tog', key + '|' + i + '|' + v)} aria-pressed="${list.includes(v)}">${l}</button>`).join('')}</div>`;
}
function meterHtml() {
  const es = engineState(), m = es.members[state.cur];
  const mine = RECIPES.filter(r => conflicts(r, m).length === 0).length;
  const pc = { b: 0, l: 0, s: 0, d: 0 };
  engineRecipes().forEach(r => { if (validFor(r, es.members).ok) pc[r.meal]++; });
  const low = Math.min(pc.b, pc.l, pc.d, state.school === false ? 99 : pc.s) < 5;
  return `<div class="meter" role="status"><div><b>${esc(m.name)} can eat ${mine} of ${RECIPES.length} dishes.</b></div>
    <div class="nums"><span>Meal ideas that suit everyone together:</span>${MEALS.filter(m => m !== 's' || state.school !== false).map(m => `<span>${MEAL_NAME[m]} ${pc[m]}</span>`).join('')}</div>
    ${low ? `<div class="tag warn" style="align-self:flex-start">${ic('alert')} Few matches. Some meals may repeat.</div>` : ''}</div>`;
}
function step2() {
  const i = state.cur, m = state.members[i];
  const tabs = state.members.map((x, k) => `<button class="mtab" role="tab" ${A('pick', k)} aria-selected="${k === i}"><span class="avatar ${lc(k)}">${initial(x, k)}</span>${esc(nm(x, k))}</button>`).join('');
  const auto = m.age < 4 ? 'Under 4: meals are always soft and mild.' : m.age < 12 ? 'Under 12: spicy food is always left out.' : '';
  return `<section class="card"><h2>What does ${esc(nm(m, i))} need?</h2>
    <div class="mtabs" role="tablist">${tabs}</div>
    <div><div class="lab">Allergies and intolerances <span class="muted" style="font-weight:400">(never served)</span></div>${chipGroup(ALLERGY_OPTS, m.allergies, 'allergies', i)}</div>
    <div><div class="lab">Diet or belief</div>${chipGroup(DIET_OPTS, m.diets, 'diets', i)}</div>
    <div><div class="lab">Health and comfort</div>${chipGroup(HEALTH_OPTS, m.health, 'health', i)}${auto ? `<p class="fine" style="margin-top:8px">${auto}</p>` : ''}</div>
    <div class="row">
      <div class="field"><label for="lk">Foods ${esc(nm(m, i))} loves</label><input type="text" id="lk" data-f="likes" data-i="${i}" value="${esc(m.likes)}" placeholder="curry, pasta, apples"></div>
      <div class="field"><label for="dk">Foods ${esc(nm(m, i))} will not eat</label><input type="text" id="dk" data-f="dislikes" data-i="${i}" value="${esc(m.dislikes)}" placeholder="mushrooms, olives, fish"></div>
    </div>
    <p class="fine">Separate foods with commas. Loved foods appear more often. Foods they will not eat are treated like a restriction.</p>
    <div id="meter">${meterHtml()}</div>
    ${i < state.members.length - 1 ? `<div><button class="btn ghost" ${A('pick', i + 1)}>Next person ${ic('right')}</button></div>` : ''}
  </section>
  <div class="actions"><button class="btn ghost big" ${A('goto', 1)}>${ic('left')} Back</button><button class="btn big" ${A('goto', 3)}>Next: your kitchen ${ic('right')}</button></div>`;
}

// ---------- step 3: kitchen ----------
const QUICK = [['Rice', 1000, 'g'], ['Toor dal', 500, 'g'], ['Wheat flour (atta)', 1000, 'g'], ['Eggs', 6, 'pc'], ['Curd', 500, 'g'], ['Potato', 1000, 'g'], ['Onion', 500, 'g'], ['Tomato', 500, 'g'], ['Chicken thigh', 500, 'g']];
function ingredientNames() { const s = new Set(); RECIPES.forEach(r => r.ingr.forEach(i => { if (i.cat !== 'home') s.add(i.name); })); return [...s].sort(); }
function step3() {
  const stock = state.stock.length ? state.stock.map((s, i) => `
    <li class="item"><span class="grow">${esc(s.name)}</span>
      <input type="number" min="0" step="${s.unit === 'pc' || s.unit === 'pkt' || s.unit === 'L' ? 1 : 50}" value="${s.qty}" data-f="stockqty" data-i="${i}" aria-label="Amount of ${esc(s.name)}"><span class="muted">${s.unit === 'pkt' ? 'packets' : s.unit === 'pc' ? 'pcs' : s.unit}</span>
      <button class="chip" ${A('soon', i)} aria-pressed="${!!s.soon}">Use soon</button>
      <button class="icon-btn" ${A('rm-stock', i)} aria-label="Remove ${esc(s.name)}">${ic('trash')}</button></li>`).join('')
    : `<li class="empty">Nothing added yet. Whatever you have will be used first and left off the shopping list.</li>`;
  const quick = QUICK.filter(q => !state.stock.some(s => s.name.toLowerCase() === q[0].toLowerCase()))
    .map(q => `<button class="chip" ${A('quick', q[0])}>${ic('plus')} ${q[0]}</button>`).join('');
  const fridge = state.fridge.length ? state.fridge.map((f, i) => `
    <li class="item"><span class="grow">${esc(f.name)}</span><span class="muted">${f.meals} ${f.meals === 1 ? 'meal' : 'meals'}</span>
      <button class="icon-btn" ${A('rm-fridge', i)} aria-label="Remove ${esc(f.name)}">${ic('trash')}</button></li>`).join('')
    : `<li class="empty">No cooked food at home.</li>`;
  return `<section class="card"><h2>What is already in the kitchen?</h2>
    <div class="row">
      <div class="field" style="flex:2 1 220px"><label for="st-name">Ingredient</label><input type="text" id="st-name" list="ingr" placeholder="Start typing, e.g. rice" autocomplete="off"><datalist id="ingr">${ingredientNames().map(n => `<option value="${esc(n)}">`).join('')}</datalist></div>
      <div class="field" style="flex:1 1 110px"><label for="st-qty">Amount</label><input type="number" id="st-qty" min="0" value="500"></div>
      <div class="field" style="flex:1 1 130px"><label for="st-unit">Unit</label><select id="st-unit">${UNITS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></div>
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="st-soon"> Use soon</label>
      <button class="btn" ${A('add-stock')}>${ic('plus')} Add</button>
    </div>
    ${quick ? `<div><div class="lab" style="margin-bottom:8px">Quick add</div><div class="chips">${quick}</div></div>` : ''}
    <ul class="list">${stock}</ul>
    <p class="fine">Pieces are for eggs, bread slices and fruit. Packets are for things sold in a pack, such as milk. Salt, pepper, oil and spices are always assumed to be at home.</p>
  </section>
  <section class="card"><h2>Cooked food to finish up</h2>
    <div class="row">
      <div class="field" style="flex:2 1 220px"><label for="fr-name">Dish</label><input type="text" id="fr-name" placeholder="e.g. Vegetable chili" autocomplete="off"></div>
      <div class="field" style="flex:0 0 auto"><span class="lab">Meals it covers</span><div class="stepper"><button ${A('fr-')} aria-label="Fewer">${ic('minus')}</button><span class="val" id="fr-n" aria-live="polite">${ui.frN || 1}</span><button ${A('fr+')} aria-label="More">${ic('plus')}</button></div></div>
      <button class="btn" ${A('add-fridge')}>${ic('plus')} Add</button>
    </div>
    <ul class="list">${fridge}</ul>
    <p class="fine">These fill the first lunches. Please check they suit everyone, as we cannot see what is in them.</p>
  </section>
  <div class="actions"><button class="btn ghost big" ${A('goto', 2)}>${ic('left')} Back</button><button class="btn big" ${A('goto', 4)}>Next: plan the week ${ic('right')}</button></div>`;
}

// ---------- step 4: plan ----------
function step4() {
  const reqs = state.requests.length ? state.requests.map((q, i) => `
    <li class="item"><span class="grow">${esc(wdName(q.day))} ${MEAL_NAME[q.meal].toLowerCase()}: ${esc(q.text)}</span><button class="icon-btn" ${A('rm-req', i)} aria-label="Remove request">${ic('trash')}</button></li>`).join('')
    : `<li class="empty">No special requests.</li>`;
  const grid = `<div class="grid-out" role="group" aria-label="Meals eaten out"><span></span>${MEALS.map(m => `<span class="lab gl">${MEAL_SHORT[m]}</span>`).join('')}
    ${[0, 1, 2, 3, 4, 5, 6].map(d => `<span class="dl">${esc(dayDate(d).toLocaleDateString(undefined, { weekday: 'short' }))}</span>${MEALS.map(m => { const on = state.skips.includes(d + '-' + m); return `<button class="chip" ${A('skip', d + '-' + m)} aria-pressed="${on}" aria-label="${esc(wdName(d))} ${MEAL_NAME[m]} eating out">${on ? 'Out' : 'Home'}</button>`; }).join('')}`).join('')}</div>`;
  const nR = state.members.reduce((a, m) => a + m.allergies.length + m.diets.length + m.health.length + terms(m.dislikes).length, 0);
  return `<section class="card"><h2>Anything special this week?</h2>
    <div class="row">
      <div class="field" style="flex:1 1 150px"><label for="rq-day">Day</label><select id="rq-day">${[0, 1, 2, 3, 4, 5, 6].map(d => `<option value="${d}">${esc(wdName(d))}</option>`).join('')}</select></div>
      <div class="field" style="flex:1 1 150px"><label for="rq-meal">Meal</label><select id="rq-meal">${MEALS.map(m => `<option value="${m}" ${m === 'd' ? 'selected' : ''}>${MEAL_NAME[m]}</option>`).join('')}</select></div>
      <div class="field" style="flex:2 1 200px"><label for="rq-text">I would like</label><input type="text" id="rq-text" placeholder="fish, curry, pasta, Italian" autocomplete="off"></div>
      <button class="btn" ${A('add-req')}>${ic('plus')} Add</button>
    </div>
    <ul class="list">${reqs}</ul>
    <p class="fine">Type a food, ingredient or cuisine. It is only added if it suits everyone.</p>
  </section>
  <section class="card"><h2>Eating out or away?</h2><p class="muted">Tap a meal you will not cook. It is left out of the plan and the shopping list.</p>${grid}</section>
  <section class="card soft"><div class="row" style="align-items:center"><div style="flex:1 1 260px"><h3>Ready when you are</h3><p>${state.members.length} ${state.members.length === 1 ? 'person' : 'people'}, ${nR} needs to respect, ${state.stock.length} items in stock.</p></div><button class="btn big" ${A('generate')}>${ic('spark')} Make our week</button></div></section>
  <div class="actions"><button class="btn ghost big" ${A('goto', 3)}>${ic('left')} Back</button><span></span></div>`;
}
// ===== App part 2: text helpers, week view, meal details, leftovers tab, render + events =====
const GROUP_LBL = { v: 'Vegetables', p: 'Protein', c: 'Grains', f: 'Fruit', d: 'Dairy' };
// How an amount reads on screen. Bread is counted in slices and wraps in wraps; packets and litres have their own words.
function qtyLabel(q, unit, name) {
  if (unit === 'pc') { const v = Math.round(q * 2) / 2; return /bread/i.test(name) ? `${v} ${v === 1 ? 'slice' : 'slices'}` : /tortilla/i.test(name) ? `${v} ${v === 1 ? 'wrap' : 'wraps'}` : fmtQty(v, 'pc'); }
  if (unit === 'pkt') return fmtQty(Math.round(q * 2) / 2, 'pkt');
  return fmtQty(Math.round(q * 10) / 10, unit);
}
function qtyText(q, unit, name) {
  const base = baseUnit(unit), v = baseQty(q, unit);
  if (base === 'g' || base === 'ml') return fmtQty(v < 20 ? Math.round(v) : Math.round(v / 5) * 5, base);
  return qtyLabel(v, base, name);
}
function needsLine(m) {
  const lab = (o, v) => (o.find(x => x[0] === v) || [0, v])[1];
  const p = [];
  m.allergies.forEach(a => p.push('no ' + lab(ALLERGY_OPTS, a).toLowerCase()));
  m.diets.forEach(d => p.push(lab(DIET_OPTS, d).toLowerCase()));
  m.health.forEach(h => p.push(lab(HEALTH_OPTS, h).toLowerCase()));
  terms(m.dislikes).forEach(t => p.push('no ' + t));
  if (m.age < 4) p.push('soft and mild'); else if (m.age < 12) p.push('mild');
  return p.length ? p.join(', ') : 'no restrictions';
}
function toast(msg) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
const kc = n => `${Math.round(n)} kcal`;

// ---------- whole-week view ----------
function weekMealRow(i, es) {
  const s = ui.plan.slots[i], meal = MEALS[i % NM], kind = MEAL_NAME[meal], day = Math.floor(i / NM);
  if (s && s.noschool) return '';
  if (!s || s.kind === 'skip') return `<div class="meal"><div class="skip-row"><span class="meal-ic">🍽️</span><div><div class="meal-kind">${kind}</div><div>Eating out</div></div></div></div>`;
  if (s.kind === 'none') return `<div class="meal"><div class="none-row"><span class="meal-ic">⚠️</span><div><div class="meal-kind">${kind}</div><div>${s.added ? 'Not planned yet. Choose dishes in the Day view.' : s.removed ? 'A dish was removed from your list. Choose another in the Day view.' : 'Nothing fits everyone here. Choose dishes in the Day view.'}</div></div></div></div>`;
  if (s.kind === 'fridge') return `<div class="meal"><div class="meal-btn" style="cursor:default"><span class="meal-ic">🥡</span><div><div class="meal-kind">${kind}</div><div class="meal-name">${esc(s.name)}</div><div class="meal-meta"><span class="tag good">From your fridge</span></div></div><span></span></div></div>`;
  const dishes = slotDishes(s), lead = dishes[0] ? dishes[0].r : null, open = !!ui.open[i];
  const tags = [];
  if (s.kind === 'leftover') tags.push(`<span class="tag warn">Leftovers from ${esc(wdName(s.from != null ? Math.floor(s.from / NM) : day))} Dinner</span>`);
  if (s.toSchool != null) tags.push(`<span class="tag warn">Leftover for ${esc(wdName(Math.floor(s.toSchool / NM)))} School Lunch</span>`);
  if (s.snack) tags.push(`<span class="tag warn">Leftover as Tea-Time Snack</span>`);
  if (s.request) tags.push(`<span class="tag" style="background:var(--accent);color:var(--on-accent);border-color:var(--ink)">Your request</span>`);
  if (s.repeated) tags.push(`<span class="tag bad">Repeat</span>`);
  const lines = dishes.map(d => `<li><span>${esc(d.r.name)}</span><span class="kc">${kc(d.r.nutr.kcal)}</span></li>`).join('');
  return `<div class="meal ${open ? 'open' : ''}"><button class="meal-btn" ${A('open', i)} aria-expanded="${open}">
      <span class="meal-ic" aria-hidden="true">${lead ? (ill(lead.id) || lead.icon) : ''}</span>
      <span><span class="meal-kind">${kind}</span><ul class="dlist">${lines}</ul>${tags.length ? `<span class="meal-meta">${tags.join('')}</span>` : ''}</span>
      ${ic('down', 'chev')}</button>${open ? mealDetail(i, s, es, scaledF(es)) : ''}</div>`;
}
function mealDetail(i, s, es, f) {
  const dishes = slotDishes(s);
  const part = d => {
    const r = d.r, notes = [];
    es.members.forEach(m => {
      if ((m.health.includes('soft') || m.age < 4) && r.soft === 1) notes.push(`${esc(m.name)}: cut into small pieces and add a little sauce so it is easy to chew.`);
      if (m.diets.includes('halal') && r.allergens.some(a => MEAT.includes(a))) notes.push(`${esc(m.name)}: buy halal-certified meat.`);
      if (m.diets.includes('kosher') && r.allergens.some(a => MEAT.includes(a))) notes.push(`${esc(m.name)}: buy kosher-certified meat.`);
    });
    const body = d.kind === 'leftover'
      ? `<div><h4>Reheat</h4><p>This was cooked for dinner. Keep it covered in the fridge and heat it until steaming hot all the way through.</p></div>`
      : `<div><h4>Ingredients for ${es.members.length} ${es.members.length === 1 ? 'person' : 'people'}</h4><ul>${r.ingr.map(g => g.cat === 'home' ? `<li>${esc(g.name)}, to taste</li>` : `<li>${qtyText(g.qty * f, g.unit, g.name)} ${esc(g.name)}</li>`).join('')}</ul></div>
         ${r.steps.length ? `<div><h4>Method</h4><ol>${r.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>` : ''}`;
    return `<div class="cblock"><h3 class="cb-h">${ROLE_NAME[d.role]}: ${esc(r.name)}</h3>${body}
      ${notes.length ? `<div class="notice">${ic('info')}<div>${notes.join('<br>')}</div></div>` : ''}
      ${r.variation ? `<p><b>Notes:</b> ${esc(r.variation)}</p>` : ''}</div>`;
  };
  return `<div class="detail">${dishes.map(part).join('')}</div>`;
}

// ---------- leftovers tab ----------
function leftoversTab(es, S) {
  const L = S.leftovers;
  const names = ds => ds.map(d => esc(d.r.name)).join(', ');
  const planned = L.planned.length ? L.planned.map(x => x.kind === 'school'
    ? `<li class="item"><span class="grow">${esc(wdName(x.fromDay))} Dinner to ${esc(wdName(x.day))} School Lunch: ${names(x.dishes)}</span><button class="btn ghost small-btn" ${A('leftover-dinner', x.fromDay * NM + MEALS.indexOf('d'))}>Cook fresh instead</button></li>`
    : `<li class="item"><span class="grow">${esc(wdName(x.day))} Breakfast to Tea-Time Snack: ${names(x.dishes)}</span><button class="btn ghost small-btn" ${A('leftover-snack', x.day * NM)}>Remove</button></li>`).join('')
    : `<li class="empty">No leftovers are being reused. On a Breakfast card you can tick "Use leftover as Tea-Time Snack". On a Dinner card you can tick the School Lunch option.</li>`;
  const fr = L.fridge.length ? L.fridge.map(x => `<li class="item"><span class="grow">${esc(x.name)} on ${esc(wdName(x.day))}</span></li>`).join('') : `<li class="empty">No cooked food from the fridge in this plan.</li>`;
  const used = S.usedStock.length ? `<div class="chips">${S.usedStock.map(u => `<span class="tag good">${ic('check')} ${esc(u.name)}: ${fmtQty(u.qty, u.unit)}</span>`).join('')}</div>` : '<p class="muted">None of your stock matched this week\'s meals.</p>';
  const unused = S.unusedStock.length ? `<ul class="list">${S.unusedStock.map(u => `<li class="item"><span class="grow">${esc(u.name)}: ${fmtQty(u.qty, u.unit)} left over${u.wasUsed ? ' after the plan' : ''}</span>${u.soon ? '<span class="tag warn">Use soon</span>' : ''}</li>`).join('')}</ul>` : '<p class="muted">Everything you listed is used. Nothing left over.</p>';
  const ideas = S.ideas.length ? `<div><h4 style="font-family:var(--font-display);margin:0 0 8px">Ideas to use up the rest</h4><div class="alts">${S.ideas.map(x => x.recipes.map(r => `<div class="alt"><span>${ico(r)} <b>${esc(r.name)}</b> <span class="muted small">uses ${esc(x.stock.name)}</span></span><button class="btn small-btn" ${A('idea', r.id)}>${ic('swap')} Swap into plan</button></div>`).join('')).join('')}</div></div>` : '';
  return `<div class="two-col"><section class="card"><h2>Leftovers you chose to reuse</h2><ul class="list">${planned}</ul><p class="fine">Reused leftovers need no extra shopping. Cool cooked food within 2 hours, keep it covered in the fridge and eat it within 3 days. Reheat until steaming hot.</p></section>
    <section class="card"><h2>Cooked food from your fridge</h2><ul class="list">${fr}</ul></section></div>

// ---------- render + events ----------
function render() {

  if (fk) { const el = $app.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if (el) el.focus({ preventScroll: true }); }

function regenerate() { ui.plan = generatePlan(engineState(), state.seed); ui.view = 'results'; ui.tab = 'plan'; ui.day = todayIdx(); ui.range = 'day'; ui.done = {}; ui.open = {}; ui.alt = {}; ui.checked = {}; ui.showText = null; ui.confirmShop = null; }
const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };

// Put one dish into one slot of a meal (id '' = leave that slot empty).
function setDish(i, role, id) {
  let s = ui.plan.slots[i]; if (!s || s.kind === 'skip' || s.kind === 'leftover' || s.kind === 'fridge') return false;
  if (s.kind === 'none') { s = ui.plan.slots[i] = { kind: 'recipe', items: blankItems() }; }
  s.items = { ...blankItems(), ...s.items, [role]: id };
  delete s.comboId; delete s.repeated;
  if (!ROLES.some(r => s.items[r])) { unlinkLeftover(ui.plan.slots, i); ui.plan.slots[i] = { kind: 'none', added: true }; }

}

function act(a, arg) {
  switch (a) {
    case 'goto': ui.view = 'wizard'; ui.step = +arg; window.scrollTo(0, 0); break;
    case 'goto-results': ui.view = 'results'; window.scrollTo(0, 0); break;
    case 'fresh': state = blankState(); weeks = {}; ui.plan = null; ui.step = 1; break;
    case 'age-': case 'age+': { const m = state.members[+arg]; m.age = Math.max(1, Math.min(110, m.age + (a === 'age+' ? 1 : -1))); break; }
    case 'add-member': state.cookFor = null; state.members.push({ id: Date.now(), name: '', age: 30, allergies: [], diets: [], health: [], likes: '', dislikes: '' }); break;
    case 'rm-member': state.cookFor = null; state.members.splice(+arg, 1); state.cur = Math.min(state.cur, state.members.length - 1); break;
    case 'pick': state.cur = +arg; break;
    case 'tog': { const [key, i, v] = arg.split('|'); const l = state.members[+i][key]; const k = l.indexOf(v); if (k < 0) l.push(v); else l.splice(k, 1); break; }
    case 'quick': { const q = QUICK.find(x => x[0] === arg); if (q) state.stock.push({ name: q[0], qty: q[1], unit: q[2], soon: false }); break; }
    case 'add-stock': { const n = val('st-name').trim(), q = Number(val('st-qty')); if (!n || !(q > 0)) { toast('Type an ingredient and an amount'); return; } const soon = document.getElementById('st-soon').checked; state.stock.push({ name: n, qty: q, unit: val('st-unit'), soon }); document.getElementById('st-name').value = ''; break; }
    case 'rm-stock': state.stock.splice(+arg, 1); break;
    case 'soon': state.stock[+arg].soon = !state.stock[+arg].soon; break;
    case 'fr-': ui.frN = Math.max(1, (ui.frN || 1) - 1); break;
    case 'fr+': ui.frN = Math.min(6, (ui.frN || 1) + 1); break;
    case 'add-fridge': { const n = val('fr-name').trim(); if (!n) { toast('Type the name of the dish'); return; } state.fridge.push({ name: n, meals: ui.frN || 1 }); document.getElementById('fr-name').value = ''; ui.frN = 1; break; }
    case 'rm-fridge': state.fridge.splice(+arg, 1); break;
    case 'add-req': { const t = val('rq-text').trim(); if (!t) { toast('Type what you would like'); return; } state.requests.push({ day: +val('rq-day'), meal: val('rq-meal'), text: t }); document.getElementById('rq-text').value = ''; break; }
    case 'rm-req': state.requests.splice(+arg, 1); break;
    case 'skip': { const k = state.skips.indexOf(arg); if (k < 0) state.skips.push(arg); else state.skips.splice(k, 1); break; }
    case 'generate': state.seed = 1; regenerate(); window.scrollTo(0, 0); break;
    case 'week': openWeek(arg); break;
    case 'next-week': planNext(); break;
    case 'newseed': state.seed = (state.seed || 1) + 1; regenerate(); toast('Fresh ideas for the week'); break;
    case 'tab': ui.tab = arg; ui.showText = null; window.scrollTo(0, 0); break;
    case 'day': ui.day = +arg; break;
    case 'day-step': ui.day = Math.max(0, Math.min(6, ui.day + Number(arg))); break;
    case 'range': ui.range = arg; break;
    case 'cf-': case 'cf+': { const n = state.members.length, cur = state.cookFor || n; state.cookFor = Math.max(1, Math.min(30, cur + (a === 'cf+' ? 1 : -1))); break; }
    case 'done': ui.done[arg] = !ui.done[arg]; break;
    case 'swapopen': ui.alt[arg] = !ui.alt[arg]; break;
    case 'open': ui.open[arg] = !ui.open[arg]; break;
    case 'alts': ui.alt[arg] = !ui.alt[arg]; break;
    case 'swap': { const [i, cid] = arg.split('|'); ui.plan = swapMeal(ui.plan, +i, cid); ui.alt[i] = false; toast('Meal swapped. Shopping list updated'); break; }

    // ---- change one dish of a meal ----
    case 'setdish': {
      const [i, role, id] = arg.split('|');
      if (!setDish(+i, role, id)) return;
      break;
    }
    case 'swapdish': {
      const [i, role] = arg.split('|'), si = +i, key = arg;
      ui.sw = ui.sw || {}; ui.sw[key] = (ui.sw[key] || 0) + 1;
      const s = ui.plan.slots[si], was = s && s.items && recipeById(s.items[role]);
      const nid = suggestDish(ui.plan, engineState(), si, role, ui.sw[key] - 1);
      if (!nid) { toast(`No other ${ROLE_NAME[role]} fits everyone`); return; }
      setDish(si, role, nid);
      toast(`${was ? was.name + ' replaced by ' : 'Added '}${recipeById(nid).name}`);
      break;
    }

    // ---- optional leftovers ----
    case 'leftover-dinner': {
      const di = +arg, s = ui.plan.slots[di]; if (!s) return;
      const on = s.toSchool == null;
      if (!setDinnerLeftover(ui.plan, di, on)) { toast('There is no School Lunch left this week to use it for'); return; }
      toast(on ? `Leftover dinner will be ${wdName(Math.floor(ui.plan.slots[di].toSchool / NM))}'s School Lunch. No extra shopping` : 'School Lunch goes back to a freshly cooked meal');
      break;
    }
    case 'leftover-snack': {
      const s = ui.plan.slots[+arg]; if (!s || s.kind !== 'recipe') return;
      if (s.snack) delete s.snack; else s.snack = true;
      toast(s.snack ? 'Leftover breakfast will be the Tea-Time Snack. No extra shopping' : 'Tea-Time Snack removed');
      break;
    }
    case 'cook-fresh': { unlinkLeftover(ui.plan.slots, +arg); toast('Back to a freshly cooked meal'); break; }

    case 'idea': {
      const r = engineRecipes().find(x => x.id === arg); if (!r) return;
      const si = ui.plan.slots.findIndex((s, i) => MEALS[i % NM] === r.meal && s && s.kind === 'recipe' && !s.request && s.toSchool == null && !s.snack);
      if (si < 0) { toast('No free slot for this meal type'); return; }
      ui.plan = swapMeal(ui.plan, si, arg); toast(`Swapped into ${wdName(Math.floor(si / NM))} ${MEAL_NAME[r.meal]}`); break;
    }
    default: { const r = shopAct(a, arg); if (r === 'stop') return; if (r !== 'ok') libAct(a, arg); }
  }
  render();
}

});
// ===== App part 3: dashboard views (day strip, meal cards with dish slots, week view, bottom navigation) =====

const isToday = i => iso(dayDate(i)) === iso(new Date());
// Optional: paste direct image links here, e.g. PHOTO_URLS = { idli: 'https://images.pexels.com/photos/.../idli.jpeg' }.

// ---------- actions ----------
function libAct(a, arg) {
  switch (a) {
    case 'recipes': if (ui.view !== 'recipes') ui.libFrom = ui.view; ui.view = 'recipes'; ui.edit = null; ui.confirmDel = null; window.scrollTo(0, 0); break;
    case 'lib-back': ui.view = ui.libFrom === 'wizard' || !ui.plan ? 'wizard' : 'results'; ui.edit = null; ui.libText = null; window.scrollTo(0, 0); break;
    case 'lib-filter': ui.libCat = arg; break;
    case 'lib-role': ui.libRole = arg; break;
    case 'rc-meal': { const l = ui.edit.meals, k = l.indexOf(arg); if (k < 0) l.push(arg); else l.splice(k, 1); break; }
    case 'lib-add': ui.edit = blankDraft(); ui.editId = null; ui.editErr = null; window.scrollTo(0, 0); break;
    case 'lib-edit': { const r = recipeById(arg); if (r) { ui.edit = toDraft(r); ui.editId = r.id; ui.editErr = null; window.scrollTo(0, 0); } break; }
    case 'lib-dup': { const r = recipeById(arg); if (r) { ui.edit = toDraft({ ...r, name: r.name + ' (copy)', art: r.art || (ART[r.id] ? r.id : '') }); ui.editId = null; ui.editErr = null; window.scrollTo(0, 0); } break; }
    case 'lib-del': ui.confirmDel = arg; break;
    case 'lib-del-no': ui.confirmDel = null; break;
    case 'lib-del-yes': {
      const k = RECIPES.findIndex(r => r.id === arg); if (k >= 0) { const nm = RECIPES[k].name; RECIPES.splice(k, 1); saveRecipes(); repairPlans(); toast(`Deleted "${nm}"`); }
      ui.confirmDel = null; break;
    }
    case 'lib-cancel': ui.edit = null; ui.editId = null; ui.editErr = null; window.scrollTo(0, 0); break;
    case 'lib-save': saveDraft(); break;
    case 'rc-al': case 'rc-gr': { const key = a === 'rc-al' ? 'allergens' : 'groups', l = ui.edit[key], k = l.indexOf(arg); if (k < 0) l.push(arg); else l.splice(k, 1); break; }
    case 'rc-flag': ui.edit[arg] = !ui.edit[arg]; break;
    case 'ing-add': ui.edit.ingr.push(blankIng()); break;
    case 'ing-rm': ui.edit.ingr.splice(+arg, 1); if (!ui.edit.ingr.length) ui.edit.ingr.push(blankIng()); break;
    case 'lib-export': {
      const json = JSON.stringify(RECIPES, null, 2); ui.libText = json;
      try { const l = document.createElement('a'); l.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); l.download = 'family-table-dishes.json'; document.body.appendChild(l); l.click(); l.remove(); } catch (e) { /* the text box below is the fallback */ }
      break;
    }
    case 'lib-hide': ui.libText = null; break;
    case 'lib-import': { const f = document.getElementById('lib-file'); if (f) f.click(); return; }
    case 'lib-restore': {

// Rows come from three places: ingredients the plan needs (some already in stock), items the family added by hand, and merged repeats.
// state.shop = { extra: [{id, name, qty, unit, group, gone}], hidden: { 'name|unit': 1 }, merged: { 'item|unit': true } } belongs to the week.
const SHOP_FILTERS = [['all', 'All'], ['buy', 'To buy'], ['home', 'At home'], ['dup', 'Repeated'], ['mine', 'Added by me']];
const dupKey = name => norm(String(name).replace(/\(.*?\)/g, '')).replace(/\s+/g, ' ').trim();

function shopModel(S) {
  const sh = state.shop || (state.shop = blankShop());
  const base = [], removed = [];
  S.items.forEach(it => {
    const key = it.name + '|' + it.unit, buy = it.buy > 0;
    const row = { key, name: it.name, unit: it.unit, group: GROUP_CODES.includes(it.group) ? it.group : guessGroup(it.name), kind: buy ? 'buy' : 'home', qty: buy ? it.buy : it.total, have: it.fromStock, total: it.total, mine: false, parts: [{ t: 'a', key }], ref: 'a:' + key };
    (sh.hidden[key] ? removed : base).push(row);
  });
  sh.extra.forEach(x => {
    const unit = baseUnit(x.unit), qty = baseQty(Number(x.qty) || 0, x.unit);
    const row = { key: 'x:' + x.id, name: x.name, unit, group: GROUP_CODES.includes(x.group) ? x.group : guessGroup(x.name), kind: 'buy', qty, have: 0, total: qty, mine: true, parts: [{ t: 'x', id: x.id }], ref: 'x:' + x.id };
    (x.gone ? removed : base).push(row);

  // repeated = the same item appears more than once on the list
  const byName = {}; base.forEach(r => { r.dk = dupKey(r.name); (byName[r.dk] = byName[r.dk] || []).push(r); });
  let rows = [];
  Object.keys(byName).forEach(dk => {
    let list = byName[dk];
    if (list.length > 1) {
      const byUnit = {}; list.forEach(r => { (byUnit[r.unit] = byUnit[r.unit] || []).push(r); });
      const next = [];
      Object.keys(byUnit).forEach(u => {
        const b = byUnit[u];
        if (b.length > 1 && sh.merged[dk + '|' + u]) {
          const buyQty = b.reduce((a, r) => a + (r.kind === 'buy' ? r.qty : 0), 0), auto = b.find(r => !r.mine) || b[0];
          next.push({ key: 'm:' + dk + '|' + u, name: auto.name, unit: u, group: auto.group, kind: buyQty > 0 ? 'buy' : 'home', qty: buyQty > 0 ? buyQty : b.reduce((a, r) => a + r.total, 0), have: b.reduce((a, r) => a + r.have, 0), total: b.reduce((a, r) => a + r.total, 0), mine: b.some(r => r.mine), merged: true, mergeKey: dk + '|' + u, dk, parts: b.flatMap(r => r.parts), ref: 'm:' + dk + '|' + u });
        } else b.forEach(r => next.push(r));

    }
    list.forEach(r => { r.dup = list.length > 1 && !r.merged; r.canMerge = r.dup && list.filter(x => x.unit === r.unit && !x.merged).length > 1; });

    const sj = stateJson(), stateChanged = sj !== cloud.last.state;
    const wkRows = [], wkJson = {};
    Object.keys(weeks).forEach(k => { const j = JSON.stringify(weeks[k]); wkJson[k] = j; if (cloud.last.weeks[k] !== j) wkRows.push({ household_id: HH_ID, week_start: k, data: weeks[k], updated_at: new Date().toISOString() }); });
    const wkGone = Object.keys(cloud.last.weeks).filter(k => !(k in wkJson));
    if (!changed.length && !gone.length && !stateChanged && !wkRows.length && !wkGone.length) { cloudSet('live'); cloud.busy = false; return; }
    cloudSet('syncing');
    await sbUpsert('ft_dishes', changed, 'id');
    for (const id of gone) await sb('DELETE', 'ft_dishes?id=eq.' + encodeURIComponent(id));
    if (stateChanged) await sbUpsert('ft_household', [{ id: HH_ID, state: state, updated_at: new Date().toISOString() }], 'id');
    await sbUpsert('ft_weeks', wkRows, 'household_id,week_start');
    for (const k of wkGone) await sb('DELETE', 'ft_weeks?household_id=eq.' + HH_ID + '&week_start=eq.' + k);
    cloud.last.dishes = cur; cloud.last.state = sj; cloud.last.weeks = wkJson;
    cloudSet('live');
  } catch (e) { cloudSet('offline'); }
  cloud.busy = false;
}
function cloudQueue() {
  if (cloud.applying || cloud.status === 'connecting') return;
  clearTimeout(cloud.timer); cloud.timer = setTimeout(cloudPush, 900);
}

// Read everything from Supabase. The first run copies the starter dishes and meal ideas into the tables.
async function cloudPull(first) {
  if (cloud.timer || cloud.busy) return;
  try {
    const [dRows, iRows, hRows, wRows] = await Promise.all([
      sb('GET', 'ft_dishes?select=*&order=sort_order'),
      sb('GET', 'ft_meal_ideas?select=*&order=sort_order'),
      sb('GET', 'ft_household?select=*&id=eq.' + HH_ID),
      sb('GET', 'ft_weeks?select=*&household_id=eq.' + HH_ID)
    ]);
    cloud.applying = true;
    let legacy = [];
    if (!dRows.length) {
      await sbUpsert('ft_dishes', STARTER_RECIPES.map(dishToRow), 'id');
      cloud.last.dishes = {}; // push below records the baseline
    } else {
      legacy = dRows.filter(x => !x.role || !(x.meals && x.meals.length)).map(x => x.id);   // saved by an older app version: converted here, written back below
      const list = dRows.map(rowToDish);
      RECIPES.length = 0; list.forEach(r => RECIPES.push(r)); libVer++;
      try { localStorage.setItem(RECIPE_KEY, JSON.stringify(RECIPES)); } catch (e) { /* ignore */ }
    }
    // meal ideas: the starter ideas always win; ideas only found in the database are kept
    const ideaRow = (c, i) => ({ id: c.id, meal: c.meal, cuisine: c.cuisine, dishes: comboDishIds(c), sort_order: i });
    const sameIdea = (a, b) => a && a.meal === b.meal && JSON.stringify(comboDishIds(a)) === JSON.stringify(comboDishIds(b));
    const starterIds = new Set(STARTER_COMBOS.map(c => c.id));
    const extras = iRows.filter(x => !starterIds.has(x.id)).map(x => ({ id: x.id, meal: x.meal, cuisine: x.cuisine, dishes: comboDishIds(x) }));
    const stale = STARTER_COMBOS.map(ideaRow).filter(row => !sameIdea(iRows.find(x => x.id === row.id), row));
    if (stale.length) await sbUpsert('ft_meal_ideas', stale, 'id');
    COMBOS.length = 0; STARTER_COMBOS.concat(extras).forEach(c => COMBOS.push({ id: c.id, meal: c.meal, cuisine: c.cuisine, dishes: comboDishIds(c) })); libVer++;
    if (hRows.length && hRows[0].state && Array.isArray(hRows[0].state.members) && hRows[0].state.members.length) {
      const st = fixState(hRows[0].state); st.cur = Math.min(st.cur || 0, st.members.length - 1);
      const w = {}; wRows.forEach(x => { w[x.week_start] = x.data; });
      weeks = w; state = st;
      const key = (state.wkKey && weeks[state.wkKey]) ? state.wkKey : (weeks[state.start] ? state.start : Object.keys(weeks).sort()[0]);
      if (key && weeks[key] && Array.isArray(weeks[key].plan && weeks[key].plan.slots) && weeks[key].plan.slots.length === 21) {
        const wk = weeks[key]; WK_FIELDS.forEach(k => { if (wk[k] !== undefined) state[k] = wk[k]; });
        state.wkKey = key; ui.plan = wk.plan; ui.checked = wk.checked || {}; ui.done = wk.done || {};
        if (first) { ui.day = todayIdx(); ui.view = 'results'; }
      }
      planMigrated = false; repairPlans();
      cloud.last.state = stateJson(); cloud.last.weeks = {}; Object.keys(weeks).forEach(k => { cloud.last.weeks[k] = JSON.stringify(weeks[k]); });
      if (planMigrated) cloud.last.weeks = {};          // plans from an older version are written back in the new shape
    } else { cloud.last.state = ''; cloud.last.weeks = {}; }
    cloud.applying = false;
    cloudSet('syncing');
    if (dRows.length) { cloud.last.dishes = {}; RECIPES.map(dishToRow).forEach(r => { if (!legacy.includes(r.id)) cloud.last.dishes[r.id] = JSON.stringify({ ...r, updated_at: 0 }); }); }
    await cloudPush();
    if (cloud.status !== 'offline') cloudSet('live');
    if (first || dRows.length || hRows.length) render();
  } catch (e) { console.log("ERR",e); cloud.applying = false; cloudSet("offline"); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && cloud.status !== 'connecting') cloudPull(false); });
// ===== Boot =====
load();
render();
cloudPull(true).then(() => { if (cloud.status === 'connecting') cloudSet('offline'); });
</script>
